# Fixture for testFromYAMLSourcePath.
#
# This file must stay a plain source path in the repo (not generated by
# writeText/runCommand). fromYAML has to antiquote the path so it is copied
# into the store with string context; using `toString` instead drops the
# context and the builder fails with "no such file or directory". Store paths
# survive `toString`, so only a source path like this catches that.
variables:
  APP: from-source-path
